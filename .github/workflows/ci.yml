name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and build shared package
        run: |
          cd packages/shared && npm ci && npm run build

      - name: Install all apps
        run: |
          cd apps/aurora && npm ci
          cd ../foRAVEr && npm ci
          cd ../jeffer && npm ci
          cd ../singularity && npm ci

      - name: Typecheck all
        run: |
          cd apps/aurora && npm run typecheck
          cd ../foRAVEr && npm run typecheck
          cd ../jeffer && npm run typecheck
          cd ../singularity && npm run typecheck
          cd ../../packages/shared && npm run typecheck

      - name: Test all
        run: |
          cd apps/aurora && npm test
          cd ../foRAVEr && npm test
          cd ../jeffer && npm test
          cd ../singularity && npm test

      - name: Build all
        run: |
          cd apps/aurora && npm run build
          cd ../foRAVEr && npm run build
          cd ../jeffer && npm run build
          cd ../singularity && npm run build
          cd ../../packages/shared && npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-all
          path: |
            apps/aurora/dist
            apps/foRAVEr/dist
            apps/jeffer/dist
            apps/singularity/dist
            packages/shared/dist
          retention-days: 7

  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Install and build shared package
        run: |
          cd packages/shared && npm ci && npm run build

      - name: Install all apps
        run: |
          cd apps/aurora && npm ci
          cd ../foRAVEr && npm ci
          cd ../jeffer && npm ci
          cd ../singularity && npm ci

      - name: Smoke test Aurora
        run: cd apps/aurora && npm run smoke
        env:
          CHROME_PATH: /usr/bin/chromium-browser

      - name: Smoke test FOraveR
        run: cd apps/foRAVEr && npm run smoke
        env:
          CHROME_PATH: /usr/bin/chromium-browser

      - name: Smoke test Jeffer
        run: cd apps/jeffer && npm run smoke
        env:
          CHROME_PATH: /usr/bin/chromium-browser

      - name: Smoke test Singularity
        run: cd apps/singularity && npm run smoke
        env:
          CHROME_PATH: /usr/bin/chromium-browser

      - name: Upload smoke captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-captures
          path: |
            apps/aurora/.smoke
            apps/foRAVEr/.smoke
            apps/jeffer/.smoke
            apps/singularity/.smoke
          retention-days: 7