<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Generative Singularity">
  <defs>
    <radialGradient id="sky" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#1b2440" />
      <stop offset="55%" stop-color="#0a0d18" />
      <stop offset="100%" stop-color="#04050a" />
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="28%" stop-color="#cfe6ff" />
      <stop offset="65%" stop-color="#4a7ab5" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#4a7ab5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#7a1f2b" stop-opacity="0" />
      <stop offset="78%" stop-color="#ff5a4a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff5a4a" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#sky)" />
  <g filter="url(#soft)" fill="#eaf2ff">
    <circle cx="96" cy="120" r="2.6" opacity="0.9" />
    <circle cx="404" cy="92" r="2.0" opacity="0.7" />
    <circle cx="150" cy="392" r="2.2" opacity="0.75" />
    <circle cx="372" cy="356" r="3.0" opacity="0.85" />
    <circle cx="248" cy="70" r="1.6" opacity="0.6" />
    <circle cx="316" cy="452" r="1.8" opacity="0.6" />
    <circle cx="70" cy="268" r="1.5" opacity="0.5" />
    <circle cx="452" cy="220" r="2.4" opacity="0.7" />
    <circle cx="200" cy="196" r="1.4" opacity="0.55" />
  </g>
  <circle cx="256" cy="256" r="190" fill="url(#halo)" />
  <ellipse cx="256" cy="256" rx="196" ry="58" fill="none" stroke="#8fc4ff" stroke-opacity="0.22" stroke-width="3" transform="rotate(-18 256 256)" />
  <circle cx="256" cy="256" r="132" fill="url(#core)" />
