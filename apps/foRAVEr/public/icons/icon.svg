<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FORAVER">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#ff2d95" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#7a1fbf" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#07060a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8ff3d" />
      <stop offset="100%" stop-color="#28f0d0" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#07060a" />
  <circle cx="256" cy="246" r="230" fill="url(#glow)" />
  <!-- The kaleidoscope: eight petals folded about the centre. -->
  <g transform="translate(256 246)" fill="none" stroke-linecap="round">
    <g id="petals">
      <path d="M0 0 C 40 -60 40 -150 0 -210 C -40 -150 -40 -60 0 0 Z" fill="url(#petal)" opacity="0.85" />
      <path d="M0 -210 C 60 -170 150 -170 210 0 C 150 40 60 40 0 0" fill="none" stroke="#ff2d95" stroke-width="7" opacity="0.8" />
    </g>
    <use href="#petals" transform="rotate(45)" />
    <use href="#petals" transform="rotate(90)" />
    <use href="#petals" transform="rotate(135)" />
    <use href="#petals" transform="rotate(180)" />
    <use href="#petals" transform="rotate(225)" />
    <use href="#petals" transform="rotate(270)" />
    <use href="#petals" transform="rotate(315)" />
  </g>
  <circle cx="256" cy="246" r="26" fill="#07060a" />
  <circle cx="256" cy="246" r="14" fill="#c8ff3d" />
</svg>
